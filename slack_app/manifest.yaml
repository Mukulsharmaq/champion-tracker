display_information:
  name: GTM Signal System
  description: Champion moves, the weekly GTM brief and accounts to work, with buttons to act or correct.
features:
  bot_user:
    display_name: GTM Signal System
    always_online: false
  slash_commands:
    - command: /pipeline
      description: Run the pipeline and post the digest, the brief and the List here
      should_escape: false
oauth_config:
  scopes:
    bot:
      - chat:write          # digest, cards, ops message, private notes after a click
      - im:write            # conversations.open: the review owner's DM channel, to share the review canvas
      - im:history          # read a DM'd card back when a correction or paste-profile form is saved
      - canvases:write      # the brief as a canvas tab and the review canvas, replaced in place; canvases.access.set
      - lists:write         # next steps as a Slack List, rows updated in place
      - lists:read
      - files:read          # canvas and List permalinks
      - commands            # /pipeline
      - channels:history    # field notes; read a channel card back when a form is saved
      - groups:history      # the same for private channels
      - channels:read       # conversations.info: preflight (bot in channel) and the Slack Connect guard
      - groups:read         # the same for private channels
      - users:read
      - users:read.email    # CRM owner email -> Slack id (users.lookupByEmail)
settings:
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
