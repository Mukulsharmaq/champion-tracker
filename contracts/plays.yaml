# Approved plays. The system picks one; it never invents a play.
plays:
  P1:
    name: "Champion moved: intro play"
    when: "Confirmed champion joined a company that is not a customer"
    seller_does: "Congratulate, reference what they did with us at the old company, offer a short look at how teams like theirs run it"
  P2:
    name: "Champion moved to an existing customer: expansion play"
    when: "Confirmed champion joined a company that is already a customer"
    seller_does: "Loop in the account owner; position them as an internal sponsor for expansion"
  P3:
    name: "Champion still at customer: reference / watch"
    when: "Champion has not moved"
    seller_does: "Keep as a reference; watch for a move"
